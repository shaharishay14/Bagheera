# Serves the built SPA and proxies API calls to the backend container.
server {
    listen 80;
    server_name _;

    # WSI metadata / CSV uploads can be sizeable.
    client_max_body_size 200m;

    root /usr/share/nginx/html;
    index index.html;

    # API → backend service on the compose network. "backend" is the service name.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # TRIDENT/PANTHER kickoff requests and large viz responses can run long.
        proxy_connect_timeout 60s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # SPA fallback — let React Router handle client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
