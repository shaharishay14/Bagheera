services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        CUDA_IMAGE: ${CUDA_IMAGE:-nvidia/cuda:12.1.1-cudnn8-runtime-ubuntu22.04}
        TORCH_INDEX: ${TORCH_INDEX:-https://download.pytorch.org/whl/cu121}
        TRIDENT_REF: ${TRIDENT_REF:-main}
        PANTHER_REF: ${PANTHER_REF:-main}
    env_file: .env
    ipc: host
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ${WSI_DATA_DIR}:/data:ro
      - ${STATE_DIR_INTERNAL}/db:/state/db
      - ${STATE_DIR_INTERNAL}/hf_cache:/state/hf_cache
      - ${STATE_DIR_EXTERNAL}/viz_cache:/state/viz_cache
      - ${STATE_DIR_EXTERNAL}/inference_outputs:/state/inference_outputs
      - ${STATE_DIR_EXTERNAL}/datasets_splits:/opt/PANTHER/src/splits/datasets_splits
      - ${STATE_DIR_EXTERNAL}/trident_processed:/app/backend/trident_processed
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    restart: unless-stopped
